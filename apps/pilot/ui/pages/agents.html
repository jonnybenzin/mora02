<!-- AGENTS page — the agent builder (agent-layer increment 4).
     Rendered by navigate('agents') → initAgents() in js/agents.js.

     Left: every instance folder under data/agents/instances/ (GET /agents/roster?include_inactive=1).
     Right: one agent as a form — identity, model, limits, skills, tool rights, SOUL —
     saved with PUT /agents/<id>, checked with GET /agents/drift, rolled out with
     POST /agents/deploy, tried with POST /agent/<id>/message.

     Buttons come from the shared Pilot components (.tool-btn). Inputs are the
     compact kind the FLOWS page uses, scoped to .agb-* so nothing here collides
     with the Pilot's .fl-* form namespace. -->
<style>
  .agb-wrap{font-family:var(--font,monospace);padding:18px 20px;max-width:1180px;margin:0 auto}
  .agb-top{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .agb-title{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-muted,#888)}
  .agb-sp{flex:1}

  .agb-cols{display:grid;grid-template-columns:246px minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:860px){ .agb-cols{grid-template-columns:1fr} }

  /* left: the roster */
  .agb-list{border:1px solid var(--bd,#2a2a2a);border-radius:10px;background:var(--c-grey1,#141414);overflow:hidden;position:sticky;top:12px}
  .agb-list-h{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent,#2b7);padding:11px 13px 8px;display:flex;align-items:center}
  .agb-list-n{margin-left:auto;font-size:10px;color:var(--tx-muted,#666)}
  .agb-row{display:flex;align-items:center;gap:9px;padding:8px 13px;cursor:pointer;border-left:2px solid transparent;border-top:1px solid var(--bd,#242424)}
  .agb-row:hover{background:var(--c-grey2,#1c1c1c)}
  .agb-row.sel{border-left-color:var(--accent,#2b7);background:var(--c-grey2,#1c1c1c)}
  .agb-row.off{opacity:.5}
  .agb-ico{width:18px;text-align:center;flex-shrink:0;font-size:14px}
  .agb-row-t{min-width:0;flex:1}
  .agb-row-n{font-size:11.5px;font-weight:700;color:var(--tx-primary,#eee);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .agb-row-m{font-size:9.5px;color:var(--tx-muted,#777);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .agb-pill{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:4px;border:1px solid var(--bd,#333);color:var(--tx-muted,#999);flex-shrink:0}
  .agb-pill.cloud{color:#f0abfc;border-color:#7a4a8a}
  .agb-pill.local{color:#a3e635;border-color:#4a6a1a}

  /* right: the form */
  .agb-main{min-height:280px}
  .agb-note{font-size:12px;color:var(--tx-muted,#888);padding:16px 2px;line-height:1.55}
  .agb-err{font-size:12px;color:#e77;padding:14px 2px;white-space:pre-wrap}
  .agb-card{border:1px solid var(--bd,#2a2a2a);border-radius:10px;background:var(--c-grey1,#141414);padding:13px 15px;margin-bottom:12px}
  .agb-card-h{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent,#2b7);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .agb-card-h .agb-hint{margin-left:auto;text-transform:none;letter-spacing:0}
  .agb-head-n{font-size:17px;font-weight:700;color:var(--tx-primary,#eee)}
  .agb-dirty{font-size:10.5px;color:#eb4;font-weight:400;margin-left:8px}

  .agb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .agb-f{min-width:0}
  .agb-l{font-size:10px;color:var(--tx-muted,#888);margin-bottom:3px;display:flex;gap:6px;align-items:baseline}
  .agb-l b{color:var(--tx-primary,#ddd);font-weight:700}
  .agb-in,.agb-sel,.agb-ta{width:100%;box-sizing:border-box;background:var(--c-black,#0e0e0e);border:1px solid var(--bd,#2a2a2a);border-radius:6px;color:var(--tx-primary,#eee);font-family:var(--font,monospace);font-size:11.5px;padding:6px 8px}
  .agb-in:focus,.agb-sel:focus,.agb-ta:focus{outline:none;border-color:var(--accent,#2b7)}
  .agb-in[disabled]{opacity:.5}
  .agb-ta{min-height:260px;resize:vertical;line-height:1.45;font-size:11px}
  .agb-ta.short{min-height:54px}
  .agb-hint{font-size:10.5px;color:var(--tx-muted,#777);line-height:1.4}
  .agb-hint.bad{color:#e88}
  .agb-hint.warn{color:#eb4}
  .agb-hint.ok{color:#8d8}

  /* checkbox lists */
  .agb-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 14px}
  .agb-ck{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:6px;border:1px solid transparent}
  .agb-ck:hover{background:var(--c-grey2,#1c1c1c)}
  .agb-ck input{margin:3px 0 0;flex-shrink:0;accent-color:var(--accent,#2b7)}
  .agb-ck-t{min-width:0}
  .agb-ck-n{font-size:11.5px;font-weight:700;color:var(--tx-primary,#eee);display:flex;align-items:center;gap:6px}
  .agb-ck-d{font-size:10px;color:var(--tx-muted,#777);line-height:1.35;margin-top:1px}
  .agb-ck.act{border-color:#4a2a2a}
  .agb-ck.act.on{background:#2a1414;border-color:#a55}
  .agb-ck.act .agb-ck-n{color:#e88}
  .agb-ck.write.on{background:#241c0c;border-color:#a83}
  .agb-ck.write .agb-ck-n{color:#eb4}
  .agb-risk{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:4px;border:1px solid currentColor;font-weight:400}
  .agb-sub{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-muted,#666);margin:10px 0 4px}

  /* skill files viewer + folded workspace files */
  .agb-files-tg{cursor:pointer;text-decoration:none}
  .agb-files-tg:hover{color:var(--accent,#2b7);border-color:var(--accent,#2b7)}
  .agb-skbox{margin-top:10px;border-top:1px dashed var(--bd,#2a2a2a);padding-top:6px}
  .agb-skfiles-l{display:flex;flex-wrap:wrap;gap:4px 10px;margin:4px 0 8px}
  .agb-skfile{font-size:11px;color:var(--tx-muted,#999);cursor:pointer;padding:2px 6px;border-radius:4px;border:1px solid transparent}
  .agb-skfile:hover{color:var(--tx-primary,#eee)}
  .agb-skfile.sel{color:var(--tx-primary,#eee);border-color:var(--accent,#2b7)}
  .agb-skfile .dim{color:var(--tx-muted,#666);font-size:9.5px}
  .agb-skpre{max-height:420px;font-size:11px}
  .agb-det summary{cursor:pointer;font-size:11.5px;font-weight:700;color:var(--tx-primary,#eee);padding:6px 0;list-style:none;display:flex;gap:8px;align-items:center}
  .agb-det summary::-webkit-details-marker{display:none}
  .agb-det summary::before{content:"▸";color:var(--tx-muted,#777);font-size:10px}
  .agb-det[open] summary::before{content:"▾"}
  .agb-det{border-top:1px solid var(--bd,#242424)}
  .agb-det:first-of-type{border-top:none}

  /* action bar */
  .agb-bar{display:flex;align-items:center;gap:9px;margin:12px 0;flex-wrap:wrap}
  .agb-bar .tool-btn{padding:8px 14px;font-size:10.5px}
  .agb-bar .tool-btn[disabled]{opacity:.35;cursor:not-allowed}

  /* drift + rollout + test output */
  .agb-out{font-size:11px;line-height:1.5;color:var(--tx-secondary,#bbb);white-space:pre-wrap;background:var(--c-black,#0e0e0e);border:1px solid var(--bd,#2a2a2a);border-radius:6px;padding:8px 10px;max-height:320px;overflow:auto}
  .agb-out .ok{color:#8d8}.agb-out .bad{color:#e88}.agb-out .dim{color:var(--tx-muted,#777)}
  .agb-answer{font-size:12px;line-height:1.55;color:var(--tx-primary,#ddd);white-space:pre-wrap}
  .agb-meta{font-size:10px;color:var(--tx-muted,#777);margin-top:8px}
</style>

<div class="agb-wrap">
  <div class="agb-top">
    <span class="agb-title">Agents</span>
    <span class="agb-sp"></span>
    <button class="tool-btn tool-btn-secondary" data-agb-act="drift" title="What a deploy would change">Check drift</button>
    <button class="tool-btn tool-btn-primary" data-agb-act="new">+ New agent</button>
  </div>
  <div class="agb-cols">
    <div class="agb-list" id="agb-list"><div class="agb-note" style="padding:12px">Loading…</div></div>
    <div class="agb-main" id="agb-main"><div class="agb-note">Loading…</div></div>
  </div>
</div>
