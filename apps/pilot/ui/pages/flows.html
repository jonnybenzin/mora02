<!-- FLOWS page — the from-scratch flow builder.
     Rendered by navigate('flows') → initFlows() in js/flows.js.

     Buttons and form fields come from the shared Pilot components in css/tools.css
     (.tool-btn / .fl-field + .fl-input + .fl-label + .fl-grid). Only what has no
     equivalent there is styled here, scoped to .flw-* — deliberately NOT .fl-*,
     which is already the Pilot's form-layout namespace. -->
<style>
  .flw-wrap{font-family:var(--font,monospace);padding:18px 20px;max-width:1180px;margin:0 auto}

  /* header row */
  .flw-top{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .flw-title{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-muted,#888)}
  .flw-sp{flex:1}

  /* two columns */
  .flw-cols{display:grid;grid-template-columns:246px minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:860px){ .flw-cols{grid-template-columns:1fr} }

  /* palette */
  .flw-pal{border:1px solid var(--bd,#2a2a2a);border-radius:10px;background:var(--c-grey1,#141414);overflow:hidden;position:sticky;top:12px}
  .flw-pal-h{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent,#2b7);padding:11px 13px 8px}
  .flw-pal-scroll{max-height:calc(100vh - 150px);overflow-y:auto;padding-bottom:6px}
  .flw-grp{border-top:1px solid var(--bd,#242424)}
  .flw-grp-h{display:flex;align-items:center;gap:7px;padding:8px 13px;cursor:pointer;user-select:none;font-size:11px;color:var(--tx-muted,#999)}
  .flw-grp-h:hover{background:var(--c-grey2,#1c1c1c);color:var(--tx-primary,#eee)}
  .flw-grp-n{margin-left:auto;font-size:10px;color:var(--tx-muted,#666)}
  .flw-grp-body{display:none;padding:2px 0 6px}
  .flw-grp.open>.flw-grp-body{display:block}
  .flw-chev{width:9px;flex-shrink:0;transition:transform .15s;color:var(--tx-muted,#777)}
  .flw-grp.open>.flw-grp-h .flw-chev{transform:rotate(90deg)}

  .flw-op{padding:6px 13px 6px 27px;cursor:pointer;border-left:2px solid transparent}
  .flw-op:hover{background:var(--c-grey2,#1c1c1c);border-left-color:var(--accent,#2b7)}
  .flw-op-n{font-size:11.5px;font-weight:700;color:var(--tx-primary,#eee);display:flex;align-items:center;gap:6px}
  .flw-op-d{font-size:10px;color:var(--tx-muted,#777);line-height:1.35;margin-top:1px}
  .flw-op-io{font-size:9.5px;color:var(--tx-muted,#666);margin-top:2px;letter-spacing:.02em}
  .flw-op-why{font-size:9.5px;color:#c87;margin-top:2px;line-height:1.3}
  .flw-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .flw-dot.wired{background:#4a7}
  .flw-dot.planned{background:#a86;box-shadow:0 0 0 1px #654 inset}
  .flw-op.planned .flw-op-n{color:var(--tx-muted,#9a9a9a)}
  .flw-op.disabled{opacity:.34;cursor:not-allowed}
  .flw-op.disabled:hover{background:transparent;border-left-color:transparent}

  /* main column */
  .flw-main{min-height:280px}
  .flw-note{font-size:12px;color:var(--tx-muted,#888);padding:16px 2px;line-height:1.55}
  .flw-err{font-size:12px;color:#e77;padding:14px 2px}

  /* library */
  .flw-lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px}
  .flw-card{border:1px solid var(--bd,#2a2a2a);border-radius:10px;padding:12px 14px;background:var(--c-grey1,#141414);cursor:pointer}
  .flw-card:hover{background:var(--c-grey2,#1c1c1c);border-color:var(--accent,#2b7)}
  .flw-card-n{font-weight:700;font-size:13px;color:var(--tx-primary,#eee)}
  .flw-card-d{font-size:11px;color:var(--tx-muted,#888);margin-top:4px;line-height:1.45}
  .flw-card-f{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
  .flw-tag{font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--c-grey2,#222);color:var(--tx-muted,#9ab)}
  .flw-card-m{margin-left:auto;font-size:10px;color:var(--tx-muted,#666)}

  /* opened flow header */
  .flw-head{border:1px solid var(--bd,#2a2a2a);border-radius:10px;background:var(--c-grey1,#141414);padding:13px 15px 4px;margin-bottom:12px}
  .flw-head-n{font-size:17px;font-weight:700;color:var(--tx-primary,#eee);margin-bottom:12px}
  .flw-dirty{font-size:10.5px;color:#eb4;font-weight:400}

  /* action bar */
  .flw-bar{display:flex;align-items:center;gap:9px;margin:12px 0;flex-wrap:wrap}
  .flw-hint{font-size:10.5px;color:var(--tx-muted,#777)}
  .flw-hint.bad{color:#e88}

  /* step stack */
  .flw-step{border:1px solid var(--bd,#2a2a2a);border-radius:9px;background:var(--c-grey1,#141414);overflow:hidden}
  .flw-step.gate{border-color:#8a6a1e;border-style:dashed;background:#17140c}
  .flw-step.planned{border-style:dashed}
  .flw-step-h{display:flex;align-items:center;gap:9px;padding:10px 12px}
  .flw-num{font-size:10px;color:var(--tx-muted,#666);width:15px;flex-shrink:0}
  .flw-step-op{font-weight:700;font-size:12px;color:var(--tx-primary,#eee)}
  .flw-step-s{flex:1;text-align:right;font-size:10.5px;color:var(--tx-muted,#888);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flw-badge{font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--c-grey2,#222);color:var(--tx-muted,#9ab);flex-shrink:0}
  .flw-badge.plan{color:#e9a;border:1px solid #a56}
  .flw-badge.gate{color:#eb4;border:1px solid #a83}
  .flw-ref{font-size:10.5px;color:var(--tx-muted,#888);padding:0 12px 10px 36px}
  .flw-ref b{color:var(--accent,#2b7);font-weight:600}
  .flw-none{color:var(--tx-muted,#666);font-style:italic}
  .flw-conn{width:2px;height:8px;background:var(--bd,#333);margin:0 auto}

  /* per-step tools — no shared equivalent for a 22px square icon button */
  .flw-tools{display:flex;align-items:center;gap:3px;flex-shrink:0}
  .flw-t{width:22px;height:22px;border:1px solid var(--bd,#2a2a2a);border-radius:5px;background:transparent;color:var(--tx-muted,#999);cursor:pointer;font-size:11px;line-height:1;font-family:var(--font,monospace);padding:0}
  .flw-t:hover{color:var(--tx-primary,#eee);border-color:var(--accent,#2b7)}
  .flw-t[disabled]{opacity:.25;cursor:not-allowed}
  .flw-t.del:hover{color:#e88;border-color:#a55}
  .flw-idin{background:transparent;border:1px solid transparent;border-radius:4px;color:var(--tx-muted,#777);font-family:var(--font,monospace);font-size:10.5px;padding:1px 4px;width:96px}
  .flw-idin:hover{border-color:var(--bd,#2a2a2a)}
  .flw-idin:focus{outline:none;border-color:var(--accent,#2b7);color:var(--tx-primary,#eee)}

  /* step body — parameters (increment 3b) */
  .flw-step-h{cursor:pointer;user-select:none}
  .flw-step-body{display:none;padding:2px 12px 12px 36px;border-top:1px solid var(--bd,#242424)}
  .flw-step.open>.flw-step-body{display:block}
  .flw-step.open>.flw-step-h .flw-chev{transform:rotate(90deg)}

  .flw-p{margin-top:10px}
  .flw-p-h{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .flw-p-n{font-size:11px;font-weight:700;color:var(--tx-primary,#eee)}
  .flw-p-req{color:#e9a;font-size:10px}
  .flw-p-mode{margin-left:auto;background:var(--c-black,#0e0e0e);border:1px solid var(--bd,#2a2a2a);border-radius:5px;color:var(--tx-muted,#999);font-family:var(--font,monospace);font-size:10px;padding:2px 5px;cursor:pointer}
  .flw-p-mode:focus{outline:none;border-color:var(--accent,#2b7)}
  .flw-pin{width:100%;box-sizing:border-box;background:var(--c-black,#0e0e0e);border:1px solid var(--bd,#2a2a2a);border-radius:6px;color:var(--tx-primary,#eee);font-family:var(--font,monospace);font-size:11.5px;padding:6px 8px}
  .flw-pin:focus{outline:none;border-color:var(--accent,#2b7)}
  .flw-pin.ref{color:var(--accent,#2b7)}
  .flw-p-d{font-size:10px;color:var(--tx-muted,#777);margin-top:2px;line-height:1.35}

  .flw-detail{margin-top:12px;border-top:1px dashed var(--bd,#2a2a2a);padding-top:7px}
  .flw-detail-h{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx-muted,#888);cursor:pointer;user-select:none}
  .flw-detail-h:hover{color:var(--tx-primary,#eee)}
  .flw-detail-body{display:none}
  .flw-detail.open .flw-detail-body{display:block}
  .flw-detail.open .flw-detail-h .flw-chev{transform:rotate(90deg)}
  .flw-instep{margin-top:2px}

  /* insertion point between steps — where the next block lands */
  .flw-ins{height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .flw-ins::before{content:"";position:absolute;left:0;right:0;height:1px;background:transparent}
  .flw-ins span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-muted,#555);
                background:var(--c-grey1,#141414);border:1px solid var(--bd,#2a2a2a);border-radius:9px;padding:1px 8px;line-height:1.5}
  .flw-ins:hover span{color:var(--tx-primary,#eee);border-color:var(--accent,#2b7)}
  .flw-ins.active::before{background:var(--accent,#2b7);opacity:.35}
  .flw-ins.active span{color:var(--accent,#2b7);border-color:var(--accent,#2b7)}
</style>

<div class="flw-wrap">
  <div class="flw-top">
    <div class="flw-title">Flows</div>
    <div class="flw-sp"></div>
    <button class="tool-btn tool-btn-secondary" data-fl-act="library">Bibliothek</button>
    <button class="tool-btn tool-btn-primary" data-fl-act="new">+ Neuer Flow</button>
  </div>
  <div class="flw-cols">
    <aside class="flw-pal">
      <div class="flw-pal-h">Vokabular</div>
      <div class="flw-pal-scroll" id="fl-palette"></div>
    </aside>
    <section class="flw-main" id="fl-main"></section>
  </div>
</div>
