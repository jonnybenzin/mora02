<div class="tool-wrap">

  <div class="tool-head">
    <span class="tool-title">INBOX — HITL DECISIONS</span>
    <div style="display:flex;gap:var(--sp-8,8px);align-items:center">
      <button id="inbox-demo" style="font-family:var(--font);font-size:var(--fs-xs,11px);letter-spacing:var(--ls-wide);padding:6px 12px;border-radius:6px;cursor:pointer;background:transparent;color:var(--tx-muted);border:1px solid var(--bd)">+ DEMO RUN</button>
      <button id="inbox-refresh" title="Neu laden" style="background:transparent;border:1px solid var(--bd);border-radius:6px;color:var(--tx-muted);cursor:pointer;padding:6px;display:flex"><svg width="14" height="14" fill="currentColor"><use href="icons/sprite.svg#i-reload"/></svg></button>
      <button class="tool-close" data-action="navigate" data-page="home" tabindex="-1"><svg fill="currentColor"><use href="icons/sprite.svg#i-close"/></svg></button>
    </div>
  </div>

  <div id="inbox-list" style="padding:var(--sp-16,16px) 0">
    <div style="color:var(--tx-muted);font-family:var(--font);font-size:var(--fs-sm);padding:var(--sp-40) 0;text-align:center;letter-spacing:var(--ls-wide)">LADE …</div>
  </div>

</div>
