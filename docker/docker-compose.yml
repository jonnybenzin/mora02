services:
 # ============================================================================
  # CORE LLM & CHAT SERVICES (mit Profiles für Benchmark)
  # ============================================================================
  
  # Qwen3-14B (Baseline - aktuell im Einsatz)
  llama-qwen3-14b:
    profiles: ["qwen3-14b"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10711  # build the model benchmarks were measured on; bump deliberately
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/mora02/ai-models/llama-cpp:/models
    environment:
      - LLAMA_ARG_MODEL=/models/Qwen3-14B-Q4_K_M.gguf
      - LLAMA_ARG_CTX_SIZE=32768
      - LLAMA_ARG_N_GPU_LAYERS=-1
      - LLAMA_ARG_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qwen3-8B (kleiner, schneller)
  llama-qwen3-8b:
    profiles: ["qwen3-8b"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10711  # build the model benchmarks were measured on; bump deliberately
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/mora02/ai-models/llama-cpp:/models
    environment:
      - LLAMA_ARG_MODEL=/models/Qwen3-8B-Q4_K_M.gguf
      - LLAMA_ARG_CTX_SIZE=32768
      - LLAMA_ARG_N_GPU_LAYERS=-1
      - LLAMA_ARG_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  ####
  llama-qwen36-27b:
    profiles: ["qwen36-27b"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10711  # build the model benchmarks were measured on; bump deliberately
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/mora02/ai-models/llama-cpp:/models
    environment:
      - LLAMA_ARG_MODEL=/models/Qwen3.6-27B-UD-IQ3_XXS.gguf
      # 64 KiB KV pro Token (16 von 64 Schichten sind Attention,
      # der Rest SSM mit fester Zustandsgroesse) -> 131072 = 8,0 GiB.
      # Gemessener Anschlag lag bei 44,7k von 45,5k nutzbaren.
      - LLAMA_ARG_CTX_SIZE=131072
      - LLAMA_ARG_N_GPU_LAYERS=-1
      - LLAMA_ARG_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  llama-glimmer-30b:
    profiles: ["glimmer-30b"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10711  # build the model benchmarks were measured on; bump deliberately
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/mora02/ai-models/llama-cpp:/models
    environment:
      - LLAMA_ARG_MODEL=/models/Muse-Glimmer-30B-UD-Q3_K_XL.gguf
      - LLAMA_ARG_CTX_SIZE=65536
      - LLAMA_ARG_N_GPU_LAYERS=-1
      - LLAMA_ARG_HOST=0.0.0.0
      # Meta's recommended sampling for this model. llama.cpp's own default is
      # temp 0.8, which is what the running server reported -- so openclaw does
      # not send one and these server-side defaults should actually take hold.
      # Verify after loading: curl -s localhost:8080/slots | grep temperature
      #- LLAMA_ARG_TEMP=1.0
      #- LLAMA_ARG_TOP_P=0.95
      #- LLAMA_ARG_TOP_K=64
    command: ["--temp", "1.0", "--top-p", "0.95", "--top-k", "64", "--reasoning-preserve"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]    
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qwen2.5-7B-Instruct
  llama-qwen25-7b:
    profiles: ["qwen25-7b"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10711  # build the model benchmarks were measured on; bump deliberately
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/mora02/ai-models/llama-cpp:/models
    environment:
      - LLAMA_ARG_MODEL=/models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
      - LLAMA_ARG_CTX_SIZE=32768
      - LLAMA_ARG_N_GPU_LAYERS=-1
      - LLAMA_ARG_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qwen2.5-Coder-14B
  llama-qwen25-coder:
    profiles: ["qwen25-coder"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10711  # build the model benchmarks were measured on; bump deliberately
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/mora02/ai-models/llama-cpp:/models
    environment:
      - LLAMA_ARG_MODEL=/models/qwen2.5-coder-14b-instruct-q4_k_m.gguf
      - LLAMA_ARG_CTX_SIZE=32768
      - LLAMA_ARG_N_GPU_LAYERS=-1
      - LLAMA_ARG_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nous-Hermes-2-Mistral-7B
  llama-nous-hermes:
    profiles: ["nous-hermes"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10711  # build the model benchmarks were measured on; bump deliberately
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/mora02/ai-models/llama-cpp:/models
    environment:
      - LLAMA_ARG_MODEL=/models/nous-hermes-2-mistral-7b-q4_k_m.gguf
      - LLAMA_ARG_CTX_SIZE=32768
      - LLAMA_ARG_N_GPU_LAYERS=-1
      - LLAMA_ARG_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Magistral Small 24B (Reasoning)
  llama-magistral:
    profiles: ["magistral"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10711  # build the model benchmarks were measured on; bump deliberately
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/mora02/ai-models/llama-cpp:/models
    environment:
      - LLAMA_ARG_MODEL=/models/Magistral-Small-2506-Q4_K_M.gguf
      - LLAMA_ARG_CTX_SIZE=32768
      - LLAMA_ARG_N_GPU_LAYERS=-1
      - LLAMA_ARG_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # MEDIA GENERATION
  # ============================================================================

  comfyui:
    build: 
      context: ./ComfyUI
    image: local-comfyui
    container_name: comfyui
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8188:8188"
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188 --normalvram --reserve-vram 1.0 --preview-method none
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - FAL_KEY=${FAL_KEY}
      - U2NET_HOME=/data/rembg
    volumes:
      - /opt/mora02/volumes:/data
      - /opt/mora02/docker/ComfyUI/workflows:/app/ComfyUI/user/default/workflows
      - /opt/mora02/ai-models/comfyui:/app/ComfyUI/models
      - /opt/mora02/output/_default/comfyui/wip:/app/ComfyUI/output
      - /opt/mora02/docker/ComfyUI/custom_nodes:/app/ComfyUI/custom_nodes
      ##- /opt/mora02/docker/ComfyUI/python-packages:/home/appuser/.local
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - mora02-net
      
  # ============================================================================
  # SHARED SERVICES (Redis - used by Penpot for websocket notifications)
  # ============================================================================

  redis:
    image: redis:7.4.11-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - /opt/mora02/volumes/redis:/data
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # BASEROW - PROJECT MANAGEMENT & DATA HUB
  # ============================================================================

  postgres-baserow:
    image: postgres:15.19-alpine
    container_name: postgres-baserow
    restart: unless-stopped
    environment:
      POSTGRES_USER: baserow
      POSTGRES_PASSWORD: ${POSTGRES_BASEROW_PASSWORD}
      POSTGRES_DB: baserow
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /opt/mora02/volumes/postgres-baserow:/var/lib/postgresql/data
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baserow"]
      interval: 10s
      timeout: 5s
      retries: 5

  baserow:
    image: baserow/baserow:1.26.1
    container_name: baserow
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      BASEROW_PUBLIC_URL: http://mora02.local:8085
      DATABASE_HOST: postgres-baserow
      DATABASE_NAME: baserow
      DATABASE_USER: baserow
      DATABASE_PASSWORD: ${POSTGRES_BASEROW_PASSWORD}
      DATABASE_PORT: 5432
      BASEROW_WEBHOOKS_ALLOW_PRIVATE_ADDRESS: 'true'
    volumes:
      - /opt/mora02/volumes/baserow:/baserow/data
    depends_on:
      postgres-baserow:
        condition: service_healthy
    networks:
      - mora02-net
      
# ============================================================================
# TOOLS DATABASE (Penpot)
# ============================================================================

  postgres-tools:
    image: postgres:15.19-alpine
    container_name: postgres-tools
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_TOOLS_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /opt/mora02/volumes/postgres-tools:/var/lib/postgresql/data
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

 # ============================================================================
 # PENPOT - Design Tool
 # ============================================================================

  penpot-backend:
    image: penpotapp/backend:2.17.2 
    container_name: penpot-backend
    restart: unless-stopped
    volumes:
      - /opt/mora02/volumes/penpot-assets:/opt/data/assets
    environment:
      PENPOT_FLAGS: "enable-registration enable-login-with-password disable-email-verification disable-smtp disable-google-fonts-provider"
      PENPOT_PUBLIC_URI: "http://localhost:8101"
      PENPOT_DATABASE_URI: "postgresql://postgres-tools/penpot"
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: ${PENPOT_DATABASE_PASSWORD}
      PENPOT_REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
    depends_on:
      postgres-tools:
        condition: service_healthy
    networks:
      - mora02-net

  penpot-exporter:
    image: penpotapp/exporter:2.17.2
    container_name: penpot-exporter
    restart: unless-stopped
    extra_hosts:
      - "fonts.googleapis.com:127.0.0.1"
      - "fonts.gstatic.com:127.0.0.1"
    volumes:
      - /opt/mora02/volumes/penpot-assets:/opt/data/assets:ro
      - /opt/mora02/volumes/fonts:/usr/share/fonts/custom:ro
    environment:
      PENPOT_PUBLIC_URI: "http://penpot-frontend:8080"
      PENPOT_REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379/2"
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
    networks:
      - mora02-net

  penpot-frontend:
    image: penpotapp/frontend:2.17.2
    container_name: penpot-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8080"
    volumes:
      - /opt/mora02/volumes/penpot-assets:/opt/data/assets
    environment:
      PENPOT_FLAGS: "enable-registration enable-login-with-password disable-email-verification disable-google-fonts-provider"
      PENPOT_PUBLIC_URI: "http://localhost:8101"
      PENPOT_BACKEND_URI: "http://penpot-backend:6060"
      PENPOT_EXPORTER_URI: "http://penpot-exporter:6061"
    depends_on:
      - penpot-backend
      - penpot-exporter
    networks:
      - mora02-net

 # ============================================================================
 # EXCALIDRAW - Whiteboard & Collaboration
 # ============================================================================

  excalidraw-room:
    image: excalidraw/excalidraw-room@sha256:2fe999f9be4379e3ee282fc45d75d84a691a6383dde33544514cc395287c7a70  # "latest" of 2023-12-15, unchanged since
    container_name: excalidraw-room
    restart: unless-stopped
    ports:
      - "127.0.0.1:8103:80"
    networks:
      - mora02-net

  excalidraw:
    image: excalidraw/excalidraw@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9  # "latest" of 2026-05-06; the image has no version tags
    container_name: excalidraw
    restart: unless-stopped
    ports:
      - "127.0.0.1:8102:80"
    environment:
      - REACT_APP_WS_SERVER_URL=ws://mora02.local:8103
      - REACT_APP_HTTP_STORAGE_BACKEND_URL=http://excalidraw-room:80
    depends_on:
      - excalidraw-room
    networks:
      - mora02-net

# ============================================================================
# IMAGE SERVER
# ============================================================================
  nginx-images:
    image: nginx:1.31.5-alpine
    container_name: nginx-images
    restart: unless-stopped
    ports:
      - "8092:80"
    volumes:
      - /opt/mora02/output/_default/comfyui:/usr/share/nginx/html/comfyui:ro
      - /opt/mora02/output/_default/socialmedia:/usr/share/nginx/html/socialmedia:ro
      - /opt/mora02/docker/nginx-images/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/mora02/apps/_archive/assistant:/usr/share/nginx/html/assistant:ro
      - /opt/mora02/apps/_archive/daily-bot:/usr/share/nginx/html/daily-bot:ro
      - /opt/mora02/apps/script-runner/frontend:/usr/share/nginx/html/script-bot:ro
      - /opt/mora02/output/_default/script-bot/final:/usr/share/nginx/html/script-bot-assets:ro
      - /opt/mora02/apps/_archive/socialmedia-bot:/usr/share/nginx/html/socialmedia-bot:ro 
      - /opt/mora02/apps/pilot/ui:/usr/share/nginx/html/pilot:ro
      - /opt/mora02/output/_default/script-bot/downloads:/usr/share/nginx/html/script-bot-downloads:ro
      - /opt/mora02/output/_default/gifer:/usr/share/nginx/html/tool-assets/gifer:ro
      - /opt/mora02/output/_default/clipper:/usr/share/nginx/html/tool-assets/clipper:ro
      - /opt/mora02/output/_default/typer:/usr/share/nginx/html/tool-assets/typer:ro
      - /opt/mora02/output/_default/pixeltext:/usr/share/nginx/html/pixeltext:ro
      - /opt/mora02/kompendium:/usr/share/nginx/html/wiki:ro
      - /opt/mora02/state/xray:/usr/share/nginx/html/x-ray:ro
      - /opt/mora02/output/_default/tts:/usr/share/nginx/html/tool-assets/tts:ro
      - /opt/mora02/output/_default/music:/usr/share/nginx/html/tool-assets/music:ro
      - /opt/mora02/output/_default/uploads:/usr/share/nginx/html/tool-assets/uploads:ro
      - /opt/mora02-material/library:/usr/share/nginx/html/library-assets:ro
    networks:
      - mora02-net

# ============================================================================
# SYSTEM ASSISTANT SERVICES
# ============================================================================

  searxng:
    image: searxng/searxng:2026.9.8-3fdc6d753
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8094:8080"
    volumes:
      - /opt/mora02/docker/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://mora02.local:8094
      - SEARXNG_SECRET=${SEARXNG_SECRET_KEY}
    networks:
      - mora02-net

# ============================================================================
# SCRIPT RUNNER - GIF/Video/Image Generation API
# ============================================================================

  script-runner:
    build:
      context: ..
      dockerfile: apps/script-runner/Dockerfile
    image: script-runner:latest
    container_name: script-runner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      # Data directory for wip and final outputs
      - /opt/mora02/output/_default/script-bot:/data
      - /opt/mora02/output/_default/socialmedia:/socialmedia-assets
      - /opt/mora02/output/_default/gifer:/data/final/gifer
      - /opt/mora02/output/_default/clipper:/data/final/clipper
      - /opt/mora02/output/_default/typer:/data/final/typer
      - /opt/mora02/output/_default/socialmedia:/socialmedia-assets
      # LLM switcher briefkasten (read/write requests, read responses + state)
      - /opt/mora02/llm-switch:/llm-switch
      # Docker socket for Chatterbox container control (ADR-020)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # TTS output (absolute path; library writes here)
      - /opt/mora02/output/_default/tts:/opt/mora02/output/_default/tts
      - /opt/mora02/output/_default/comfyui/wip:/comfyui-wip:ro
      # pipelines
      - /opt/mora02/volumes/openclaw/workspace:/data/openclaw/workspace
      - /opt/mora02/pipelines:/data/pipelines
      # blender
      - /opt/mora02/output/_default/pixeltext:/pixeltext-out:ro
      # image upload
      - /opt/mora02/output/_default/uploads:/uploads:ro
      # library
      - /opt/mora02-material/library:/library:ro
      # agents
      - /opt/mora02/agents:/data/agents
      - /opt/mora02/data/agents:/data/agents-local

    environment:
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY}
      - BASEROW_TOKEN=${BASEROW_TOKEN}
      - TZ=Europe/Berlin
      - KOKORO_URL=http://kokoro-tts:8880
      - PIPER_URL=http://piper-tts:8107
      - CHATTERBOX_URL=http://chatterbox-tts:4123
      - ANTHROPIC_API_KEY=${CLAUDE_API_KEY}
      - MORA02_LINKEDIN_TOKEN=${MORA02_LINKEDIN_TOKEN}
      - MORA02_LINKEDIN_AUTHOR=${MORA02_LINKEDIN_AUTHOR}
      - MORA02_SIGNAL_TARGET=${MORA02_SIGNAL_TARGET}
      - MORA02_RUN_FAILURE_NOTIFY=${MORA02_RUN_FAILURE_NOTIFY:-}
      - MORA02_ASSET_STORE_LIBRARY=/library
      - MORA02_ASSET_URLPATH_LIBRARY=/library-assets
      - MORA02_AGENTS_LOCAL_DIR=/data/agents-local
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================================================
# BLENDER WORKER - PixelText 3D Typo Renderer (GPU)
# ============================================================================

  blender-worker:
    build:
      context: /opt/mora02/apps/blender-worker
      dockerfile: Dockerfile
    image: blender-worker:latest
    container_name: blender-worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:8097"
    volumes:
      - /opt/mora02/output/_default/pixeltext:/output
      - /opt/mora02/apps/blender-worker/scripts:/scripts:ro
      - /opt/mora02/apps/blender-worker/templates:/templates
    environment:
      - TZ=Europe/Berlin
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      # VRAM guard threshold (MB). Below this, render returns HTTP 503.
      - VRAM_REQUIRED_MB=8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================================================
# TTS SERVICES
# ============================================================================
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.2
    container_name: kokoro-tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:8106:8880"
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  chatterbox-tts:
    build:
      context: /opt/mora02/apps/chatterbox-api
      dockerfile: docker/Dockerfile.blackwell
    container_name: chatterbox-tts
    restart: "no"
    ports:
      - "127.0.0.1:8108:4123"
    environment:
      - DEVICE=cuda
      - EXAGGERATION=0.5
      - CFG_WEIGHT=0.5
      - TEMPERATURE=0.8
      - MODEL_CACHE_DIR=/cache
      - VOICE_LIBRARY_DIR=/voices
    volumes:
      - /opt/mora02/volumes/chatterbox/cache:/cache
      - /opt/mora02/volumes/chatterbox/voices:/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4123/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 300s

  piper-tts:
    build:
      context: /opt/mora02/apps/piper-api
      dockerfile: Dockerfile
    container_name: piper-tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:8107:8107"
    volumes:
      - /opt/mora02/ai-models/piper:/models:ro
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8107/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================================================
# PILOT BOT
# ============================================================================
  pilot:
    build:
      context: ..
      dockerfile: apps/pilot/Dockerfile
    image: pilot:latest
    container_name: pilot
    restart: unless-stopped
    ports:
      - "8098:8098"
    volumes:
      - /opt/mora02/apps/pilot/frontend:/app/static
      - /opt/mora02/output/_default/comfyui/wip:/images/wip:ro
      # Writable mounts for file deletion
      - /opt/mora02/output/_default/comfyui/wip:/output/comfyui-wip
      - /opt/mora02/output/_default/gifer:/output/gifer
      - /opt/mora02/output/_default/clipper:/output/clipper
      - /opt/mora02/output/_default/typer:/output/typer
      - /opt/mora02/output/_default/tts:/output/tts
      - /opt/mora02/output/_default/socialmedia:/socialmedia
      - /opt/mora02/apps/pilot/data/chathistory:/chathistory
      # Style reference images for IP-Adapter
      - /opt/mora02/volumes/styles:/data/styles
      # LLM switcher state (read-only): pilot reads current profile from here
      - /opt/mora02/llm-switch:/llm-switch:ro
    environment:
      - PILOT_BASEROW_TOKEN=${BASEROW_TOKEN}
      - PILOT_SCRIPT_RUNNER_URL=http://script-runner:8096
      # mora02_core library env (no PILOT_ prefix)
      - BASEROW_TOKEN=${BASEROW_TOKEN}
      - BASEROW_URL=http://baserow:80
      - ANTHROPIC_API_KEY=${CLAUDE_API_KEY}
      - QWEN_URL=http://llama-server:8080
      - COMFYUI_URL=http://comfyui:8188
      - COMFYUI_INPUT_DIR=/comfyui-input
    networks:
      - mora02-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import httpx; httpx.get('http://localhost:8098/health')"]
      interval: 30s
      timeout: 10s
      retries: 3  
      
# ============================================================================
# OPENCLAW / HITL (ADR-022) — Signal channel backend + gateway
# ============================================================================

  mora02-signal-cli:
    image: bbernhard/signal-cli-rest-api:0.100
    container_name: mora02-signal-cli
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8080"          # host 8099 -> REST API 8080 (Phase-0 port)
    environment:
      - MODE=json-rpc        # persistent json-rpc daemon (validated in Phase 0)
      - TZ=Europe/Berlin
    volumes:
      # Persists the Signal account / device-link -> restart without re-pairing
      - /opt/mora02/volumes/signal-cli:/home/.local/share/signal-cli
    networks:
      - mora02-net

  mora02-openclaw:
    build:
      context: ./openclaw
    image: mora02-openclaw:latest
    container_name: mora02-openclaw
    restart: unless-stopped
    depends_on:
      - mora02-signal-cli
    # No host port on purpose: ADR-022 keeps the gateway internal to mora02-net.
    # Pilot reaches it as http://mora02-openclaw:18789. Add a temporary
    # "18789:18789" mapping only for host-side debugging.
    environment:
      # Auth token: satisfies the lan-bind guardrail AND is what notify/Pilot send
      - OPENCLAW_GATEWAY_TOKEN=${MORA02_OPENCLAW_TOKEN}
      # Relocate config + state into the mounted volume (Option A: container-owned)
      - OPENCLAW_CONFIG_PATH=/data/openclaw/openclaw.json
      - OPENCLAW_STATE_DIR=/data/openclaw
      # Cloud reference line for the tool-calling bench (ADR-004: the 20%).
      # Referenced, never written into openclaw.json in the volume.
      - ANTHROPIC_API_KEY=${CLAUDE_API_KEY}
      - TZ=Europe/Berlin
    volumes:
      - /opt/mora02/volumes/openclaw:/data/openclaw
      - /opt/mora02/output/_default/comfyui/wip:/comfyui-wip:ro
    networks:
      - mora02-net
    healthcheck:
      # Any HTTP response means the gateway is listening (401 without token is fine).
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:18789/"]
      interval: 30s
      timeout: 10s
      retries: 3
      
# ============================================================================
# NETWORKS
# ============================================================================

networks:
  mora02-net:
    driver: bridge
