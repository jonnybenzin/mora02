# Mora02 nginx Konfiguration
# Dient Images und System Assistant Interface

server {
    listen 80;
    server_name localhost;
    
    # Root für ComfyUI Images
    root /usr/share/nginx/html;
    
    # === ComfyUI Images (Standard) ===
    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        
        # Cache für Bilder
        location ~* \.(jpg|jpeg|png|gif|webp)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # === WIP Images ===
    location /wip/ {
        alias /usr/share/nginx/html/wip/;
        autoindex on;
        autoindex_format json;
    }
    
    # === Final Images ===
    location /final/ {
        alias /usr/share/nginx/html/final/;
        autoindex on;
    }
    
    # === System Assistant Interface ===
    location /assistant/ {
        alias /usr/share/nginx/html/assistant/;
        index index.html;
        
        # Keine Cache für HTML (immer frisch)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # === Social Media Assets ===
    location /socialmedia/ {
        alias /usr/share/nginx/html/socialmedia/;
        autoindex on;
    }
    # === Pilot Bot Interface ===
    location /pilot/ {
        alias /usr/share/nginx/html/pilot/;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # === Tool Assets (gifer, clipper, typer outputs) ===
    location /tool-assets/ {
        alias /usr/share/nginx/html/tool-assets/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }
    # === TTS Audio Assets ===
    location /tool-assets/tts/ {
        alias /usr/share/nginx/html/tool-assets/tts/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }
    # === Music Audio Assets ===
    location /tool-assets/music/ {
        alias /usr/share/nginx/html/tool-assets/music/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }
    # === ComfyUI WIP JSON listing ===
    location /comfyui/wip/ {
        alias /usr/share/nginx/html/comfyui/wip/;
        autoindex on;
        autoindex_format json;
    }
    # === Wiki (knowledge archive) ===
    location /wiki/ {
        alias /usr/share/nginx/html/wiki/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }
    # === XRAY ===

    location /x-ray/ {
          alias /usr/share/nginx/html/x-ray/;
          autoindex on;
          autoindex_format json;
          add_header Cache-Control "no-cache";
      }
    # === Health Check ===
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
    
    # === Error Pages ===
    error_page 404 /404.html;
    location = /404.html {
        internal;
        return 404 '<!DOCTYPE html><html><body><h1>404 - Nicht gefunden</h1><p><a href="/">Zurück</a></p></body></html>';
        add_header Content-Type text/html;
    }
    # === library
    location /library-assets/ {
          alias /usr/share/nginx/html/library-assets/;
    }
}
